name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python neurophify.py --selftest
      - run: python neurophify.py examples/graph.json --out out
      - run: for f in brain.html brain.svg brain.json REGIONS.md CORE.md; do test -s "out/$f"; done
