<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 303" width="960" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" role="img" aria-label="neurophify czyta graf, dzieli węzły na regiony i układa regiony na 2 półkulach. Jeden układ zasila 5 plików wyjścia.">
