<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 303" width="960" font-family="'JetBrains Mono', ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5" role="img" aria-label="neurophify reads a graph, groups the nodes into regions and lays the regions out on two hemispheres. One layout feeds all five output files.">
<rect width="960" height="303" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#111111"/></marker></defs>
<text x="16" y="32" font-size="15" font-weight="bold" fill="#111111">neurophify reads a graph, groups the nodes into regions and lays the regions out</text>
<text x="16" y="53" font-size="15" font-weight="bold" fill="#111111">on two hemispheres. One layout feeds all five output files.</text>
<polyline points="230,122.5 254,122.5" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="230,245 242,245 242,122.5 254,122.5" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="468,122.5 492,122.5" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="706,122.5 730,122.5" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="599,173 599,203" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<polyline points="837,173 837,203" fill="none" stroke="#111111" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="16" y="72" width="214" height="101" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="101.5" fill="#111111" font-weight="bold">Input A</text>
<text x="24" y="118.5" fill="#111111">graphify graph.json:</text>
<text x="24" y="135.5" fill="#111111">nodes, links or edges,</text>
<text x="24" y="152.5" fill="#111111">community</text>
<rect x="254" y="72" width="214" height="101" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="262" y="93" fill="#111111" font-weight="bold">Regions</text>
<text x="262" y="110" fill="#111111">community field, or</text>
<text x="262" y="127" fill="#111111">label propagation</text>
<text x="262" y="144" fill="#111111">(seed 42); at most 24,</text>
<text x="262" y="161" fill="#111111">the rest is "other"</text>
<rect x="492" y="72" width="214" height="101" fill="#ffffff" stroke="#c8102e" stroke-width="2"/>
<text x="500" y="93" fill="#c8102e" font-weight="bold">3D layout</text>
<text x="500" y="110" fill="#111111">region centres on two</text>
<text x="500" y="127" fill="#111111">hemisphere ellipsoids;</text>
<text x="500" y="144" fill="#111111">each region takes a</text>
<text x="500" y="161" fill="#111111">patch of the surface</text>
<rect x="730" y="72" width="214" height="101" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="738" y="101.5" fill="#111111" font-weight="bold">Output files</text>
<text x="738" y="118.5" fill="#111111">brain.html (3D view)</text>
<text x="738" y="135.5" fill="#111111">brain.svg, brain.json</text>
<text x="738" y="152.5" fill="#111111">REGIONS.md, CORE.md</text>
<rect x="16" y="203" width="214" height="84" fill="#f2f2f2" stroke="#111111" stroke-width="1.5"/>
<text x="24" y="224" fill="#111111" font-weight="bold">Input B</text>
<text x="24" y="241" fill="#111111">folder of .md files:</text>
<text x="24" y="258" fill="#111111">[[page]] links and</text>
<text x="24" y="275" fill="#111111">[text](file.md) links</text>
<rect x="492" y="203" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="500" y="224" fill="#111111" font-weight="bold">Inside a patch</text>
<text x="500" y="241" fill="#111111">a force layout keeps</text>
<text x="500" y="258" fill="#111111">linked nodes close,</text>
<text x="500" y="275" fill="#111111">hubs near the centre</text>
<rect x="730" y="203" width="214" height="84" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="738" y="224" fill="#111111" font-weight="bold">Browser</text>
<text x="738" y="241" fill="#111111">3d-force-graph from</text>
<text x="738" y="258" fill="#111111">jsDelivr draws the</text>
<text x="738" y="275" fill="#111111">fixed positions</text>
</svg>
